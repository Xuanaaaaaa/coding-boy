[project]
name = "coding-boy"
version = "0.1.0"
description = "A CLI coding assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dotenv>=0.9.9",
    "openai>=2.46.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
coding-boy = "coding_boy.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
